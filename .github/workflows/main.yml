name: Generate RoarZone Playlist

on:
  schedule:
    - cron: '*/30 * * * *' # Protis 30 minute por por cholbe
  workflow_dispatch: # Manually run korar jonno

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run script
        env:
          API_URL: ${{ secrets.API_URL }}
        run: python Script/update_roarzone.py

      - name: Commit & Push
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add sys_config_cache_v9.m3u internal_data_v9.json
          git commit -m "🔄 Auto update RoarZone playlist" || echo "No changes"
          git push
