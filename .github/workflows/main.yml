name: Update Roarzone Playlist

on:
  schedule:
    - cron: '*/30 * * * *' # প্রতি ৩০ মিনিট পর পর চলবে
  workflow_dispatch: # আপনি নিজে রান করতে পারবেন

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # স্ক্রিপ্টকে ফাইল লেখার অনুমতি দেয়
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: pip install requests

      - name: Run Script
        run: python update_roarzone.py

      - name: Commit and Push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add playlist.m3u
          # যদি কোনো পরিবর্তন না থাকে তবুও জোর করে পুশ করার জন্য
          git commit -m "Auto-update: $(date)" || exit 0 
          git push
