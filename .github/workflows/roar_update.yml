name: RoarZone API Auto Update

on:
  schedule:
    - cron: '*/20 * * * *' # প্রতি ২০ মিনিট পর পর রান হবে
  workflow_dispatch: # ইচ্ছা করলে যখন খুশি ম্যানুয়ালি রান করা যাবে

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # গিটহাবে ফাইল পুশ করার জন্য এই পারমিশন জরুরি

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install Requests
        run: pip install requests

      - name: Run Script
        run: python update_api.py # আপনার পাইথন ফাইলের নাম এখানে

      - name: Commit and Push Changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          if [ -f api.json ]; then
            git add api.json
            git commit -m "Automated API Update: $(date)" || exit 0
            git push
          else
            echo "⚠️ api.json was not created. Token fetch might have failed."
          fi
